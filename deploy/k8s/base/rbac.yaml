apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: legacylift
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sandbox-jobs
  namespace: legacylift-sandbox
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log", "configmaps"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: worker-sandbox-jobs
  namespace: legacylift-sandbox
subjects:
  - kind: ServiceAccount
    name: worker
    namespace: legacylift
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sandbox-jobs
