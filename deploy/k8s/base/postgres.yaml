apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: legacylift
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.7-pg16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: legacylift
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: legacylift-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: legacylift
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "legacylift", "-d", "legacylift"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "legacylift", "-d", "legacylift"]
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: legacylift
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
