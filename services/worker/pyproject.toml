[project]
name = "legacylift-worker"
version = "0.1.0"
description = "Pipeline worker for analyze, test generation, migrate, and verify."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "ibm-watsonx-ai>=1.7.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "legacylift-sandbox",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "legacylift_worker"
module-root = "src"

[tool.uv.sources]
legacylift-sandbox = { workspace = true }
