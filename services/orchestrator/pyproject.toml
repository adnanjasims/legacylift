[project]
name = "legacylift-orchestrator"
version = "0.1.0"
description = "Job lifecycle HTTP API for LegacyLift."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pika>=1.3",
    "PyJWT>=2.9",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "legacylift_orchestrator"
module-root = "src"
